server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# --- База данных H2 (файл ./data/serverdb.mv.db, данные сохраняются между запусками) ---
spring.datasource.url=jdbc:h2:file:./data/serverdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Консоль H2 (доступна только ADMIN): http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Фиксированная локаль, чтобы числа в формах были с точкой (5.5, а не 5,5)
spring.web.locale=en_US
spring.web.locale-resolver=fixed

# --- Actuator ---
management.endpoints.web.exposure.include=health,info,metrics,loggers,env
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
management.info.env.enabled=true
info.app.name=Учёт серверной инфраструктуры
info.app.description=Курсовой проект: Spring Boot + Thymeleaf + H2
info.app.version=1.0
