<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Ошибка')}"></head>
<body>
<div class="container">
    <div class="card">
        <h1>Произошла ошибка</h1>
        <p th:text="${status} + ' ' + ${error}">500 Internal Server Error</p>
        <a class="btn" th:href="@{/}">На главную</a>
    </div>
</div>
</body>
</html>
