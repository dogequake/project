<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Вход')}"></head>
<body>
<div class="auth-box card">
    <h1>Вход</h1>
    <div class="alert error" th:if="${param.error}">Неверный логин или пароль</div>
    <div class="alert info" th:if="${param.logout}">Вы вышли из системы</div>
    <div class="alert ok" th:if="${param.registered}">Регистрация прошла успешно. Войдите в систему.</div>
    <form class="stack" th:action="@{/login}" method="post">
        <label>Логин
            <input type="text" name="username" autofocus required>
        </label>
        <label>Пароль
            <input type="password" name="password" required>
        </label>
        <button class="btn" type="submit">Войти</button>
    </form>
    <p class="muted">Нет аккаунта? <a th:href="@{/register}">Зарегистрироваться</a></p>
</div>
</body>
</html>
